<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BarBee</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BarBee">
<meta name="theme-color" content="#131822">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: dark steel scoreboard header (week stepper + five day tabs), one column of exercise cards, timer dock at the bottom.
   Each day wears a competition plate colour (red, blue, yellow, green; grey for the optional day).
   Signature: every gym set carries a five-rung 6-to-10 rep ladder that doubles as the input. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#e8ebf0; --line:#d3d8e0;
  --ink:#131822; --muted:#5d6777;
  --head:#131822; --head-ink:#f3f5f8; --head-muted:#98a3b4; --head-line:#2b3443;
  --push:#c5302a; --pull:#1d50d2; --legs:#d99a00; --upper:#1b8748; --opt:#667083;
  --push-ink:#fff; --pull-ink:#fff; --legs-ink:#1a1300; --upper-ink:#fff; --opt-ink:#fff;
  --push-hi:#ff7a70; --pull-hi:#7fa0ff; --legs-hi:#f2c230; --upper-hi:#58d08f; --opt-hi:#a9b3c2;
  --good:#0f7a4d; --good-soft:#d8f0e4; --warn:#a65a00; --warn-soft:#fbe9cf;
  --fig-far:#7f8a9b; --steel:#9aa3b1; --padc:#c2c9d4; --scrim:rgba(10,14,20,.55);
  --d:var(--push); --d-ink:var(--push-ink);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#171d27; --sunk:#212938; --line:#2f3949;
  --ink:#eef2f7; --muted:#97a3b3;
  --head:#080b10; --head-line:#232b38;
  --push:#ff7a70; --pull:#7fa0ff; --legs:#f2c230; --upper:#58d08f; --opt:#a3adbd;
  --push-ink:#0c1017; --pull-ink:#0c1017; --legs-ink:#0c1017; --upper-ink:#0c1017; --opt-ink:#0c1017;
  --good:#52d19a; --good-soft:#153a2b; --warn:#f0b057; --warn-soft:#402c0e;
  --fig-far:#8792a3; --steel:#5d6878; --padc:#3d4859; --scrim:rgba(0,0,0,.65);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#171d27; --sunk:#212938; --line:#2f3949;
  --ink:#eef2f7; --muted:#97a3b3;
  --head:#080b10; --head-line:#232b38;
  --push:#ff7a70; --pull:#7fa0ff; --legs:#f2c230; --upper:#58d08f; --opt:#a3adbd;
  --push-ink:#0c1017; --pull-ink:#0c1017; --legs-ink:#0c1017; --upper-ink:#0c1017; --opt-ink:#0c1017;
  --good:#52d19a; --good-soft:#153a2b; --warn:#f0b057; --warn-soft:#402c0e;
  --fig-far:#8792a3; --steel:#5d6878; --padc:#3d4859; --scrim:rgba(0,0,0,.65);
  color-scheme:dark }
body[data-day="pull"]{--d:var(--pull);--d-ink:var(--pull-ink)}
body[data-day="legs"]{--d:var(--legs);--d-ink:var(--legs-ink)}
body[data-day="upper"]{--d:var(--upper);--d-ink:var(--upper-ink)}
body[data-day="legs2"]{--d:var(--opt);--d-ink:var(--opt-ink)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--d);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink)}
.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{margin:0;font:800 28px/1 var(--display);letter-spacing:.015em;text-transform:uppercase}
.brand p{margin:4px 0 0;font-size:12px;color:var(--head-muted);text-transform:uppercase;letter-spacing:.1em}
.week{display:flex;align-items:center;gap:4px;background:var(--head-line);border-radius:10px;padding:3px}
.week button{width:36px;height:36px;border:0;background:none;color:var(--head-ink);border-radius:8px;font-size:20px;line-height:1}
.week button:hover:not(:disabled){background:var(--head)}
.week button:disabled{opacity:.3;cursor:default}
.week .num{min-width:84px;text-align:center;font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab b,.tab .where{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab{border:0;background:none;color:var(--head-muted);padding:6px 2px 9px;border-bottom:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tab .where{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.tab b{font:700 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em}
.tab .cnt{font-size:11.5px}
.tab .cnt.full{color:var(--c);font-weight:600}
.tab[aria-selected="true"]{border-bottom-color:var(--c);color:var(--head-ink)}
.tab[aria-selected="true"] .where{color:var(--c)}
.tab.optional{border-bottom-style:dashed}
.tab.optional b{font-weight:600}

/* Day head */
main.wrap{padding-block:20px 140px;display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:14px}
.dayhead .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dayhead .eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--d);display:inline-block}
.dayhead h2{margin:2px 0 0;font:800 44px/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.dayhead p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.tally{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ring{position:relative;width:74px;height:74px}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:7}
.ring .prg{fill:none;stroke:var(--d);stroke-width:7;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 20px/1 var(--display)}
.beat strong{display:block;font:800 30px/1 var(--display);color:var(--good)}
.beat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;max-width:70px;line-height:1.2}

.optional-note{border:2px dashed var(--d);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:4px}
.optional-note strong{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.optional-note p{margin:0;font-size:14.5px}
.prio{border-left:4px solid var(--d);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:14.5px}
.prio strong{font-weight:600}

.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rule summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:14.5px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}
.steps div{background:var(--sunk);border-radius:8px;padding:10px;font-size:13.5px;min-width:0}
.steps b{display:block;font:700 18px/1.1 var(--display);text-transform:uppercase;margin-bottom:3px}
.rule p,.rule ul{margin:0;padding:0 14px 13px;font-size:14px;color:var(--muted)}
.rule ul{padding-left:32px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card header{display:flex;gap:12px;align-items:flex-start}
.idx{font:800 30px/.9 var(--display);color:var(--d);min-width:32px}
.card h3{margin:0;font:700 23px/1.08 var(--display);text-transform:uppercase;letter-spacing:.015em;text-wrap:balance}
.card .cue{margin:4px 0 0;font-size:13.5px;color:var(--muted);max-width:60ch}
.cardbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);border-radius:6px;padding:5px 9px;white-space:nowrap}
.badge.why{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);white-space:normal}
.timerbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.timerbtn:hover{border-color:var(--d)}
.card select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;font-size:14.5px;max-width:100%;align-self:flex-start}

.set{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.set .l1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.set .aim{font-size:13.5px;color:var(--muted);min-width:0}
.set .aim b{color:var(--ink);font-weight:600}
.setno{font:700 15px/1 var(--display);text-transform:uppercase;color:var(--ink);letter-spacing:.06em;margin-right:8px}
.set .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:4px}
.field input,.cgrid input{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:center;font-weight:600;font-size:17px;padding:0 4px}
.field input{width:66px}
.field input:focus,.cgrid input:focus{border-color:var(--d);outline:none;box-shadow:0 0 0 2px var(--d)}
.field span{font-size:12px;color:var(--muted)}
.ladder{display:flex;gap:3px;margin-left:auto}
.rung{width:36px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font:700 18px/1 var(--display);color:var(--muted);padding:0}
.rung.aimed{border:2px dashed var(--d);color:var(--ink)}
.rung.on{background:var(--d);border-color:var(--d);color:var(--d-ink)}
.rung.on.top{background:var(--good);border-color:var(--good);color:var(--surface)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--surface);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip:empty{display:none}

.hist{font-size:13.5px;color:var(--muted)}
.hist summary{cursor:pointer;font-weight:500}
.hist ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.hist li b{color:var(--ink);font-weight:600;display:inline-block;min-width:34px}

.how{margin:0;padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.cgrid{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;flex-direction:column;gap:6px;min-width:0}
.crow .rowname{font-size:14px;font-weight:600}
.crow .rowname span{font-weight:400;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;max-width:calc(var(--n) * 92px)}
.cells label{display:flex;flex-direction:column;gap:2px;min-width:0}
.cells label span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cgrid input{width:100%;min-width:0}
.score{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score .tot{font:800 30px/1 var(--display)}
.score .tot small{font:400 13px var(--body);color:var(--muted);margin-left:8px}
.score .chip{background:var(--sunk)}
.score .chip.good{background:var(--good-soft)}
.score .chip.warn{background:var(--warn-soft)}

.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}

/* Timer dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);color:var(--head-ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .bar2{height:4px;background:var(--head-line)}
.dock .bar2 i{display:block;height:100%;width:0;background:var(--d)}
.dock .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.dock .big{font:800 40px/1 var(--display);min-width:92px}
.dock .txt{flex:1;min-width:0}
.dock .txt b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .txt span{font-size:12.5px;color:var(--head-muted)}
.dock button{border:1px solid var(--head-line);background:none;color:var(--head-ink);border-radius:99px;padding:8px 16px;font-weight:600}

/* Form guide */
.formbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px 5px 11px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.formbtn::before{content:"";border-left:8px solid var(--d);border-top:5px solid transparent;border-bottom:5px solid transparent}
.formbtn:hover{border-color:var(--d)}
.cardbar .formbtn{margin-left:auto}
.cardbar .formbtn + .timerbtn{margin-left:0}
.forms{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.forms span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sheet-head h3{margin:2px 0 0;font:700 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.015em;text-wrap:balance}
.sheet-head button{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:50%;font-size:22px;line-height:1}
.stage{position:relative;background:var(--sunk);border-radius:12px;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:320/260}
.phase{position:absolute;left:10px;top:10px;background:var(--d);color:var(--d-ink);font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-radius:6px}
.slow{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.slow[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:tip}
.tips li{display:flex;gap:10px;font-size:15px;line-height:1.4}
.tips li::before{counter-increment:tip;content:counter(tip);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--sunk);font:700 14px/22px var(--display);text-align:center}
@media (min-width:600px){ .sheet{align-items:center} .sheet-card{border-radius:18px;padding-bottom:18px} }

@media (max-width:480px){
  .ladder{margin-left:0;width:100%} .rung{flex:1}
  .brand h1{font-size:24px} .dayhead h2{font-size:36px}
  .tab b{font-size:17px} .tab .where{font-size:9px;letter-spacing:.04em}
  .steps{grid-template-columns:1fr}
  .beat{display:none}
}
@media (prefers-reduced-motion:no-preference){ .rung{transition:background .12s,border-color .12s} .ring .prg{transition:stroke-dashoffset .3s} }

/* Name button in the header, and the "make it yours" sheet */
#who{all:unset;cursor:pointer;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who:focus-visible{outline:2px solid var(--head-ink);outline-offset:3px}
#editor button{font-family:inherit;cursor:pointer}
#ed-card>*{flex-shrink:0}
#editor input[type=text],#editor input[type=number]{height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 10px;font:inherit;font-size:16px;width:100%;min-width:0}
#editor input[type=text]:focus,#editor input[type=number]:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 2px var(--ink)}
.ed-note{margin:0;color:var(--muted);font-size:14.5px}
.ed-f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ed-seg{display:flex;gap:6px}
.ed-seg button{flex:1;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:600;font-size:15px}
.ed-seg button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ed-h{margin:6px 0 -4px;font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ed-day{border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.ed-dayhead{width:100%;border:0;background:var(--sunk);color:var(--ink);padding:13px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ed-dayhead small{font:400 13px/1.2 Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--muted);white-space:nowrap}
.ed-daybody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.ed-ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ed-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ed-row label{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-size:12px;color:var(--muted)}
.ed-check{display:flex;align-items:center;gap:8px;font-size:14px}
.ed-check input{width:20px;height:20px;flex-shrink:0}
.ed-mini{display:flex;flex-wrap:wrap;gap:6px}
.ed-mini button,.ed-add{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600}
.ed-mini button:disabled{opacity:.4}
.ed-mini button.del{color:var(--push)}
.ed-add{align-self:flex-start}
.ed-link{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--muted);text-decoration:underline;font-size:13.5px}
.ed-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
.ed-save{width:100%;height:50px;border:0;border-radius:12px;background:var(--ink);color:var(--surface);font:700 19px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1><button type="button" id="who" aria-label="Edit my name and plan">BarBee</button></h1>
        <p>Progressive overload · week by week</p>
      </div>
      <div class="week">
        <button id="wk-prev" type="button" aria-label="Previous week">‹</button>
        <div class="num" id="wk-num" aria-live="polite">Week 1</div>
        <button id="wk-next" type="button" aria-label="Next week">›</button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</div>
<main class="wrap" id="app"></main>
<div class="dock" id="dock" hidden>
  <div class="bar2"><i id="dock-bar"></i></div>
  <div class="wrap">
    <div class="big" id="dock-big">0:00</div>
    <div class="txt"><b id="dock-label"></b><span id="dock-sub"></span></div>
    <button type="button" id="dock-stop">Stop</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <div class="sheet-head"><div><span>Form guide</span><h3 id="sheet-title"></h3></div><button type="button" id="sheet-close" aria-label="Close form guide">×</button></div>
    <div class="stage"><canvas id="form-canvas" width="640" height="520"></canvas><span class="phase" id="form-phase"></span><button type="button" class="slow" id="form-slow" aria-pressed="false">Slow motion</button></div>
    <ul class="tips" id="form-tips"></ul>
  </div>
</div>

<div class="sheet" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="ed-title"><div class="sheet-card" id="ed-card"></div></div>

<script>
/* ---------- Program: the example plan everyone starts from ---------- */
const TRI=['Cable pushdown','Overhead cable extension','Skullcrusher','Machine triceps extension'];
const CURL=['EZ-bar curl','Incline dumbbell curl','Preacher curl','Cable curl','Hammer curl'];
const ROW=['Chest-supported row, elbows flared','T-bar row, elbows flared','Chest-supported row, elbows tucked','T-bar row, elbows tucked'];
const DEFAULT_PROGRAM=[
 {id:'push',name:'Push',where:'Gym',kind:'gym',focus:'Chest, side delts, triceps',ex:[
  {id:'dips',name:'Weighted dips',sets:2,step:2.5,unit:'+kg',rest:180,cue:'Log the weight added to bodyweight. Slight forward lean, full depth, lock out every rep. Lower chest and triceps.'},
  {id:'press',name:'Chest press',sets:2,step:2.5,unit:'kg',rest:180,cue:'Set the seat or bench so you press slightly upwards: mid and upper chest, the part dips miss. Deep stretch at the bottom.'},
  {id:'lat',name:'Lateral raises',sets:3,step:1,unit:'kg',rest:90,why:'3 sets: the only direct side-delt work of the week',cue:'Lead with the elbows, no swing. Stop the set when you have to heave it.'},
  {id:'tri',name:'Triceps extension',sets:2,step:2.5,unit:'kg',rest:120,vars:TRI,cue:'Elbows fixed in place. Full stretch, full lockout. Dips and presses already hit the triceps, so 2 hard sets finish them.'}
 ]},
 {id:'pull',name:'Pull',where:'Gym',kind:'gym',focus:'Lats, upper back, biceps, erectors',ex:[
  {id:'pullup',name:'Weighted pull-ups',sets:2,step:2.5,unit:'+kg',rest:180,cue:'Log the weight added to bodyweight. Dead hang to chin over the bar, no kip. This is the lat work.'},
  {id:'row',name:'Row',sets:2,step:2.5,unit:'kg',rest:150,vars:ROW,cue:'Elbows flared is the default: it trains traps and rear delts, which pull-ups leave alone. Pick tucked only if you want extra lats that week.'},
  {id:'curl',name:'Biceps curl',sets:2,step:2.5,unit:'kg',rest:120,vars:CURL,cue:'Upper arms still, slow lowering, full stretch at the bottom.'},
  {id:'bxhi',name:'45° back extension, high pad',sets:2,step:2.5,unit:'+kg',rest:120,cue:'Erectors. Pad above the hip crease, round down and uncurl through the spine. Hold a plate at the chest.'}
 ]},
 {id:'legs',name:'Legs',where:'Gym',kind:'gym',focus:'Quads, hamstrings, adductors, calves',prio:true,ex:[
  {id:'legpress',name:'Leg press',sets:2,step:10,unit:'kg',rest:180,cue:'As deep as you can keep your hips on the pad. No bouncing out of the bottom.'},
  {id:'hamcurl',name:'Hamstring curl',sets:2,step:5,unit:'kg',rest:150,cue:'Hamstrings at the knee. Hips pinned down, squeeze at the top, slow lowering.'},
  {id:'quadext',name:'Quad extension',sets:2,step:5,unit:'kg',rest:120,cue:'Pause for a beat at full lockout. Hits the part of the quad the leg press leaves behind.'},
  {id:'bxlo',name:'45° back extension, low pad',sets:2,step:2.5,unit:'+kg',rest:120,cue:'Hamstrings at the hip. Pad below the hip crease, flat back, hinge and drive up with hamstrings and glutes.'},
  {id:'add',name:'Machine hip adduction',sets:2,step:5,unit:'kg',rest:120,cue:'Start from the widest stretch you can control. Squeeze the pads together and hold.'},
  {id:'calf',name:'Calf raises',sets:3,step:5,unit:'kg',rest:90,why:'3 sets: nothing else in the week trains calves',cue:'Two-second pause in the bottom stretch on every rep.'}
 ]},
 {id:'upper',name:'Upper',where:'Cali',kind:'cali',focus:'Bodyweight endurance, volume and the pump',blocks:[
  {id:'mu',name:'Muscle-up EMOM',tag:'8 minutes',clock:480,mode:'emom',rows:['Muscle-ups'],cols:['1','2','3','4','5','6','7','8'],colHead:'Minute',
   how:['At the top of every minute do the same number of muscle-ups, then rest for what is left of the minute.','Begin with a number you can repeat for all 8 minutes (1 or 2 is fine).','When all 8 minutes are clean, add one rep to the odd minutes next week.','No muscle-up yet? Do one explosive chest-to-bar pull-up plus one straight bar dip per rep.']},
  {id:'ssa',name:'Superset: pull-ups + straight bar dips',tag:'4 rounds',rest:90,rows:['Pull-ups','Straight bar dips'],cols:['R1','R2','R3','R4'],
   how:['Pull-ups, then straight bar dips with no rest between them.','Rounds 1 to 3: stop one rep short of failure. Round 4: go all out on both.']},
  {id:'ssb',name:'Superset: dips + ring or bar rows',tag:'3 rounds',rest:75,rows:['Dips','Bodyweight rows'],cols:['R1','R2','R3'],
   how:['Dips straight into rows. Every set as many clean reps as possible.','Rows too easy? Lower the rings or raise your feet.']},
  {id:'amrap',name:'Pump circuit AMRAP',tag:'8 minutes',clock:480,mode:'amrap',rows:['Score'],cols:['Rounds','Extra reps'],mult:[24,1],
   how:['As many rounds as possible in 8 minutes: 4 pull-ups, 8 dips, 12 push-ups.','Break the sets however you need, just keep moving. Log full rounds and any reps into the next one.']},
  {id:'burn',name:'Push-up burnout',tag:'3 max sets',rest:45,rows:['Push-ups'],cols:['S1','S2','S3'],
   how:['Three max-rep sets, chest to the floor, with only 45 seconds between them. Finish with nothing left.']}
 ]},
 {id:'legs2',name:'Legs',where:'Optional',kind:'cali',optional:true,focus:'Bodyweight leg endurance. Extra, never a replacement.',blocks:[
  {id:'pistol',name:'Pistol squat EMOM',tag:'8 minutes',clock:480,mode:'emom',rows:['Pistols per leg'],cols:['1','2','3','4','5','6','7','8'],colHead:'Minute',
   how:['Every minute: the same number of pistol squats on each leg, then rest for what is left of the minute.','Start with 1 or 2 per leg. When all 8 minutes are clean, add a rep to the odd minutes.','Not there yet? Sit back to a box or hold a post for balance, and lower the box over the weeks.']},
  {id:'gob',name:'Superset: goblet squats + walking lunges',tag:'4 rounds',rest:90,rows:['Goblet squats','Lunge steps'],cols:['R1','R2','R3','R4'],
   how:['Goblet squats straight into walking lunges, still holding the weight.','Use one dumbbell or kettlebell you can squat 20 times, and keep it the same every week so the reps compare.','Rounds 1 to 3: stop a couple of reps short. Round 4: empty the tank.']},
  {id:'cw',name:'Can\'t-walk circuit AMRAP',tag:'10 minutes',clock:600,mode:'amrap',rows:['Score'],cols:['Rounds','Extra reps'],mult:[30,1],
   how:['As many rounds as possible in 10 minutes: 10 bodyweight squats, 10 alternating reverse lunges, 10 jump squats.','Full depth on every rep. Slow down before the reps get shallow.']},
  {id:'sqburn',name:'Squat burnout',tag:'3 max sets',rest:45,rows:['Bodyweight squats'],cols:['S1','S2','S3'],
   how:['Three max-rep sets of bodyweight squats, 45 seconds between them. No pausing at the top.']}
 ]}
];

/* ---------- State ---------- */
const LS='barbee-v1';
/* The plan and the name belong to whoever uses the app: both are saved on their own phone. */
const clone=o=>JSON.parse(JSON.stringify(o));
const TONES=['push','pull','legs','upper','legs2'];
const DEFAULT_NAME={}; DEFAULT_PROGRAM.forEach(d=>(d.ex||d.blocks).forEach(x=>{ DEFAULT_NAME[d.id+'.'+x.id]=x.name }));
let profile={name:'',unit:'kg',set:false};
try{ const p=JSON.parse(localStorage.getItem(LS+'-profile')); if(p&&typeof p==='object') profile=Object.assign(profile,p) }catch(e){}
function validPlan(p){ return Array.isArray(p)&&p.length>0&&p.every(d=>d&&d.id&&typeof d.name==='string'&&(d.kind==='gym'?Array.isArray(d.ex):Array.isArray(d.blocks))) }
let PROGRAM=clone(DEFAULT_PROGRAM);
try{ const p=JSON.parse(localStorage.getItem(LS+'-plan')); if(validPlan(p)) PROGRAM=p }catch(e){}
const toneOf=d=>d.tone||(TONES.includes(d.id)?d.id:'push');
let state={weeks:{}}, view=1, dayId=PROGRAM[0].id;
try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.weeks){state=s} }catch(e){}
function hasData(w){ if(!w||!w.e) return false; return Object.values(w.e).some(a=>/[0-9]/.test(JSON.stringify(a))) }
function latestWeek(){ let m=1; for(const n in state.weeks){ if(hasData(state.weeks[n])) m=Math.max(m,+n) } return m }
view=latestWeek();
try{ const u=JSON.parse(localStorage.getItem(LS+'-ui')); if(u){ if(u.view>=1) view=u.view; if(PROGRAM.some(d=>d.id===u.day)) dayId=u.day } }catch(e){}
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} }
function saveUi(){ try{localStorage.setItem(LS+'-ui',JSON.stringify({view,day:dayId}))}catch(e){} }
function wk(n,create){ let w=state.weeks[n]; if(!w&&create){ w=state.weeks[n]={t:0,vars:{},e:{}} } if(w){w.vars=w.vars||{};w.e=w.e||{}} return w }
const today=()=>PROGRAM.find(d=>d.id===dayId)||PROGRAM[0];

/* ---------- Progression logic ---------- */
const fmt=n=>String(Math.round(n*100)/100);
const mmss=s=>{ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') };
function varOf(day,ex,week){ if(!ex.vars) return ''; for(let n=week;n>=1;n--){ const v=state.weeks[n]?.vars?.[day.id+'.'+ex.id]; if(v&&ex.vars.includes(v)) return v } return ex.vars[0] }
function keyOf(day,ex,week){ return day.id+'.'+ex.id+(ex.vars?':'+varOf(day,ex,week):'') }
function prevSet(key,i,week){ for(let n=week-1;n>=1;n--){ const s=state.weeks[n]?.e?.[key]?.[i]; if(s&&s.r>0) return {w:s.w||0,r:s.r,week:n} } return null }
function targetFor(prev,step){
  if(!prev) return {type:'find'};
  if(prev.r>=10) return {type:'up',w:prev.w+step,r:6};
  if(prev.r<6) return {type:'hold',w:prev.w,r:6};
  return {type:'rep',w:prev.w,r:prev.r+1};
}
function judge(cur,prev){
  if(!cur||!(cur.r>0)) return {text:'',cls:''};
  const w=cur.w||0, ten=cur.r>=10?' · add weight next':'';
  if(!prev) return {text:(cur.r<6?'Too heavy, aim for 6':cur.r>10?'Too light, add weight':'Baseline set')+(cur.r===10?ten:''),cls:cur.r<6||cur.r>10?'warn':''};
  if(w>prev.w) return cur.r>=6?{text:'Weight up'+ten,cls:'good',beat:true}:{text:'Heavier, under 6',cls:'warn',beat:true};
  if(w<prev.w) return {text:'Lighter than last',cls:'warn'};
  if(cur.r>prev.r) return {text:'+'+(cur.r-prev.r)+' rep'+(cur.r-prev.r>1?'s':'')+ten,cls:'good',beat:true};
  if(cur.r===prev.r) return {text:'Matched'+ten,cls:''};
  return {text:'Below last',cls:'warn'};
}
function caliTotal(b,vals){ let t=0; if(!vals) return 0; b.rows.forEach((_,r)=>b.cols.forEach((_,c)=>{ const v=vals[r]?.[c]; if(v>0) t+=v*(b.mult?b.mult[c]:1) })); return t }
function prevCali(b,key,week){ for(let n=week-1;n>=1;n--){ const v=state.weeks[n]?.e?.[key]; const t=caliTotal(b,v); if(t>0) return {total:t,vals:v,week:n} } return null }
function judgeCali(total,prev){
  if(!(total>0)) return {text:'',cls:''};
  if(!prev) return {text:'Baseline',cls:''};
  if(total>prev.total) return {text:'+'+fmt(total-prev.total)+' on week '+prev.week,cls:'good',beat:true};
  if(total===prev.total) return {text:'Matched',cls:''};
  return {text:fmt(prev.total-total)+' short of week '+prev.week,cls:'warn'};
}
function countDay(day,week){
  let done=0,total=0,beat=0; const w=state.weeks[week];
  if(day.kind==='gym') day.ex.forEach(ex=>{ const key=keyOf(day,ex,week); for(let i=0;i<ex.sets;i++){ total++; const s=w?.e?.[key]?.[i]; if(s&&s.r>0){ done++; if(judge(s,prevSet(key,i,week)).beat) beat++ } } });
  else day.blocks.forEach(b=>{ total++; const key=day.id+'.'+b.id; const t=caliTotal(b,w?.e?.[key]); if(t>0){ done++; if(judgeCali(t,prevCali(b,key,week)).beat) beat++ } });
  return {done,total,beat};
}

/* ---------- Rendering ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rowMeta={};
function renderTabs(){
  $('#wk-num').textContent='Week '+view;
  $('#wk-prev').disabled=view<=1;
  $('#tabs').innerHTML=PROGRAM.map(d=>{ const c=countDay(d,view); const tone=toneOf(d), col=tone==='legs2'?'opt':tone;
    return `<button class="tab${d.optional?' optional':''}" role="tab" type="button" data-day="${d.id}" style="--c:var(--${col}-hi)" aria-selected="${d.id===dayId}" aria-label="${esc(d.name)} ${esc(d.where)}"><span class="where">${esc(d.where)}</span><b>${esc(d.name)}</b><span class="cnt${c.done===c.total?' full':''}">${c.done}/${c.total}</span></button>` }).join('');
  const T=$('#tabs'), sel=T.querySelector('[aria-selected="true"]');   // keep the chosen day in sight when the row scrolls
  if(sel){ const tr=T.getBoundingClientRect(), sr=sel.getBoundingClientRect(); if(sr.left<tr.left) T.scrollLeft-=tr.left-sr.left; else if(sr.right>tr.right) T.scrollLeft+=sr.right-tr.right }
}
function aimText(t,prev,ex){
  const u=ex.unit[0]==='+'?' '+ex.unit.slice(1)+' added':' '+ex.unit;
  if(t.type==='find') return 'First time: find the weight that gives <b>6 reps</b> with 0–1 left in the tank';
  const last=`Week ${prev.week}: ${fmt(prev.w)} × ${prev.r}`;
  if(t.type==='up') return `${last}. Ladder done, go up: <b>${fmt(t.w)}${u} × 6</b>`;
  if(t.type==='hold') return `${last}. Get to <b>${fmt(t.w)} × 6</b> first, or drop the weight a little`;
  return `${last}. Today: <b>${fmt(t.w)}${u} × ${t.r}</b>`;
}
function rungsHtml(key,i,cur,t){
  const reps=cur&&cur.r>0?cur.r:0; let h='';
  for(let n=6;n<=10;n++){ const on=reps>=n; h+=`<button type="button" class="rung${on?' on':''}${on&&reps>=10?' top':''}${!on&&t.r===n?' aimed':''}" data-rung="${n}" data-key="${esc(key)}" data-i="${i}" aria-label="Log ${n} reps" aria-pressed="${reps===n}">${n}</button>` }
  return h;
}
function historyHtml(key,isCali,b){
  const items=[];
  for(let n=view;n>=1&&items.length<8;n--){ const e=state.weeks[n]?.e?.[key]; if(!e) continue;
    if(isCali){ const t=caliTotal(b,e); if(t>0) items.push(`<li><b>W${n}</b> ${fmt(t)} total</li>`) }
    else { const s=e.filter(x=>x&&x.r>0).map(x=>`${fmt(x.w||0)} × ${x.r}`); if(s.length) items.push(`<li><b>W${n}</b> ${s.join(' · ')}</li>`) } }
  if(!items.length) return '';
  return `<details class="hist"><summary>History</summary><ul>${items.join('')}</ul></details>`;
}
const idx=n=>String(n+1).padStart(2,'0');
function renderGym(day){
  return (day.prio&&PROGRAM.some(d=>d.optional)?`<div class="prio"><strong>This is the leg day that counts.</strong> The optional calisthenics leg day is extra conditioning. If you only train legs once this week, do this one.</div>`:'')+
  `<details class="rule" ${view===1?'open':''}><summary>How the 6 to 10 ladder works</summary>
    <div class="steps"><div><b>Start at 6</b>Pick a weight you can lift for 6 reps with 0–1 left in the tank.</div><div><b>Climb to 10</b>Same weight. Add one rep every time you can: 7, 8, 9, 10.</div><div><b>Add weight</b>Hit 10, go heavier next session and start again at 6.</div></div>
    <p>Two all-out sets per exercise, three where a muscle gets no other work. Each set climbs its own ladder, so set 2 can sit a rung or a weight behind set 1.</p></details>`+
  day.ex.map((ex,n)=>{ const key=keyOf(day,ex,view); const w=state.weeks[view]; let sets='';
    for(let i=0;i<ex.sets;i++){ const cur=w?.e?.[key]?.[i]||null; const prev=prevSet(key,i,view); const t=targetFor(prev,ex.step); rowMeta[key+'#'+i]={prev,t,ex};
      const j=judge(cur,prev); const id=`${day.id}-${ex.id}-${i}`;
      sets+=`<div class="set"><div class="l1"><span class="aim"><span class="setno">Set ${i+1}</span>${aimText(t,prev,ex)}</span><span class="chip ${j.cls}" id="chip-${id}">${j.text}</span></div>
      <div class="l2"><label class="field"><input id="w-${id}" type="number" inputmode="decimal" step="any" min="0" data-kind="set" data-f="w" data-key="${esc(key)}" data-i="${i}" data-id="${id}" value="${cur&&cur.w!=null?cur.w:''}" placeholder="${t.w!=null?fmt(t.w):'–'}" aria-label="${esc(ex.name)} set ${i+1} weight"><span>${ex.unit}</span></label>
      <label class="field"><input id="r-${id}" type="number" inputmode="numeric" step="1" min="0" data-kind="set" data-f="r" data-key="${esc(key)}" data-i="${i}" data-id="${id}" value="${cur&&cur.r!=null?cur.r:''}" placeholder="${t.r||6}" aria-label="${esc(ex.name)} set ${i+1} reps"><span>reps</span></label>
      <div class="ladder" id="lad-${id}" data-id="${id}">${rungsHtml(key,i,cur,t)}</div></div></div>`; }
    const sel=ex.vars?`<select id="var-${day.id}-${ex.id}" data-var="${day.id}.${ex.id}" aria-label="${esc(ex.name)} variation">${ex.vars.map(v=>`<option${v===varOf(day,ex,view)?' selected':''}>${esc(v)}</option>`).join('')}</select>`:'';
    return `<section class="card"><header><span class="idx">${idx(n)}</span><div><h3>${esc(ex.name)}</h3><p class="cue">${esc(ex.cue||'')}</p></div></header>
      <div class="cardbar"><span class="badge">${ex.sets} sets × 6–10</span>${ex.why?`<span class="badge why">${esc(ex.why)}</span>`:''}${formBtn(gymForm(day,ex),ex.vars?varOf(day,ex,view):ex.name,'Form')}<button type="button" class="timerbtn" data-timer="${ex.rest}" data-mode="rest" data-label="Rest · ${esc(ex.name)}">Rest ${mmss(ex.rest)}</button></div>
      ${sel}${sets}${historyHtml(key)}</section>` }).join('');
}
function renderCali(day){
  return (day.optional&&PROGRAM.some(d=>d.prio)?`<div class="optional-note"><strong>Optional day</strong><p>The gym leg day comes first and matters more. Add this session only when your legs have recovered and you want extra conditioning. Never swap it in for the gym leg day, and keep at least two days between this and the next gym leg day.</p></div>`:'')+
  `<details class="rule" ${view===1?'open':''}><summary>How this day progresses</summary><ul>
    <li>The goal is total work: more reps in the same time, or the same reps on less rest.</li>
    <li>Every block has a score. Beat last week's score by at least one rep.</li>
    <li>Keep the rest times honest. Short rest is what builds the endurance and the pump.</li></ul></details>`+
  day.blocks.map((b,n)=>{ const key=day.id+'.'+b.id; const vals=state.weeks[view]?.e?.[key]; const prev=prevCali(b,key,view); const tot=caliTotal(b,vals); const j=judgeCali(tot,prev);
    const rows=b.rows.map((r,ri)=>`<div class="crow"><div class="rowname">${esc(r)}${b.colHead?` <span>by ${esc(b.colHead.toLowerCase())}</span>`:''}</div><div class="cells" style="--n:${Math.min(4,b.cols.length)}">${b.cols.map((c,ci)=>{ const v=vals?.[ri]?.[ci]; const p=prev?.vals?.[ri]?.[ci];
      return `<label><span>${esc(c)}</span><input id="c-${b.id}-${ri}-${ci}" type="number" inputmode="decimal" step="any" min="0" data-kind="cali" data-key="${esc(key)}" data-b="${b.id}" data-r="${ri}" data-c="${ci}" value="${v!=null?v:''}" placeholder="${p!=null?p:'–'}" aria-label="${esc(r)} ${esc(c)}"></label>` }).join('')}</div></div>`).join('');
    const tb=b.clock?`<button type="button" class="timerbtn" data-timer="${b.clock}" data-mode="${b.mode}" data-label="${esc(b.name)}">Start ${mmss(b.clock)} clock</button>`
                    :`<button type="button" class="timerbtn" data-timer="${b.rest}" data-mode="rest" data-label="Rest · ${esc(b.name)}">Rest ${mmss(b.rest)}</button>`;
    return `<section class="card"><header><span class="idx">${idx(n)}</span><div><h3>${esc(b.name)}</h3></div></header>
      <div class="cardbar"><span class="badge">${esc(b.tag)}</span>${tb}</div>
      <ul class="how">${b.how.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
      ${(mv=>mv.length?`<div class="forms"><span>Form</span>${mv.map(m=>formBtn(m[1],m[0],m[0])).join('')}</div>`:'')(DEFAULT_NAME[key]===b.name&&MOVES[b.id]||[])}
      <div class="cgrid">${rows}</div>
      <div class="score"><span class="tot"><span id="tot-${b.id}">${fmt(tot)}</span><small>total reps${prev?` · beat ${fmt(prev.total)} from week ${prev.week}`:' · first score sets the bar'}</small></span><span class="chip ${j.cls}" id="chip-${b.id}">${j.text}</span></div>
      ${historyHtml(key,true,b)}</section>` }).join('');
}
function tallyHtml(day){ const c=countDay(day,view); const C=2*Math.PI*30; const off=C*(1-(c.total?c.done/c.total:0));
  return `<div class="ring" role="img" aria-label="${c.done} of ${c.total} logged"><svg viewBox="0 0 74 74"><circle class="trk" cx="37" cy="37" r="30"/><circle class="prg" cx="37" cy="37" r="30" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><span>${c.done}/${c.total}</span></div><div class="beat"><strong>${c.beat}</strong><span>beat last time</span></div>` }
function render(){
  rowMeta={}; const day=today(); dayId=day.id; document.body.dataset.day=toneOf(day); $('#who').textContent=profile.name||'BarBee'; renderTabs();
  const title=esc(day.kind==='gym'?day.name+' day':day.name+', bodyweight');
  $('#app').innerHTML=`<div class="dayhead"><div><span class="eyebrow"><i></i>${day.optional?'Optional · Calisthenics':day.kind==='gym'?esc(day.where)+' · heavy, 6–10 reps':'Calisthenics · endurance'}</span><h2>${title}</h2><p>${esc(day.focus||'')}</p></div><div class="tally" id="tally">${tallyHtml(day)}</div></div>`+
    (day.kind==='gym'?renderGym(day):renderCali(day))+

let T=null, actx=null;
function beep(n){ try{ for(let k=0;k<n;k++){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); const t0=actx.currentTime+k*0.28; g.gain.setValueAtTime(0.3,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.22); o.start(t0); o.stop(t0+0.23) } }catch(e){} try{ navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:150) }catch(e){} }
function stopTimer(){ if(T){ clearInterval(T.id); clearTimeout(T.hide) } T=null; $('#dock').hidden=true }
function startTimer(sec,label,mode){
  stopTimer(); try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume() }catch(e){}
  T={end:Date.now()+sec*1000,total:sec,label,mode,lastMin:0}; $('#dock').hidden=false; $('#dock-label').textContent=label; tick(); T.id=setInterval(tick,250);
}
function tick(){ if(!T) return;
  const left=Math.max(0,(T.end-Date.now())/1000), el=T.total-left; let big=mmss(left), sub='Rest, then go again';
  if(T.mode==='emom'){ const mins=T.total/60, cur=Math.min(mins,Math.floor(el/60)+1); if(cur!==T.lastMin){ if(T.lastMin) beep(1); T.lastMin=cur } big=mmss(left>0?60-(el%60):0); sub=`Minute ${cur} of ${mins} · go on the beep` }
  else if(T.mode==='amrap') sub='Keep moving, count your rounds';
  $('#dock-bar').style.width=(100*el/T.total)+'%';
  if(left<=0){ clearInterval(T.id); beep(3); big='0:00'; sub=T.mode==='rest'?'Rest over. Next set.':'Time. Log your score.'; T.hide=setTimeout(stopTimer,6000) }
  $('#dock-big').textContent=big; $('#dock-sub').textContent=sub;
}

let db=null, canWrite=true, dirty=new Set(), flushTimer=null, flushing=false;
let syncText='Saved on this device', syncCls='';
function setSync(text,cls){ syncText=text; syncCls=cls||''; const el=$('#sync'); if(el){ el.className='sync '+syncCls; el.lastElementChild.textContent=text } }
function scheduleFlush(){ if(!db||!canWrite) return; clearTimeout(flushTimer); flushTimer=setTimeout(flush,1200) }
async function flush(){
  if(!db||!canWrite||flushing) return; flushing=true;
  try{ while(dirty.size){ const n=dirty.values().next().value; dirty.delete(n); const w=state.weeks[n]; if(!w) continue;
      try{ await db.doc('weeks/w'+n).set(JSON.parse(JSON.stringify(w))) }
      catch(err){ if(err&&err.code==='invalid_argument'){ canWrite=false; setSync('Saved on this device only'); break }
        dirty.add(n); setSync('Saved on this device, sync will retry'); setTimeout(scheduleFlush,8000); break } }
    if(canWrite&&!dirty.size) setSync('Saved and synced','ok');
  } finally { flushing=false }
}
async function initSync(){
  if(!window.claude||!window.claude.use) return;

  const timer=setTimeout(()=>setSync('Saved on this device, sync unreachable'),10000);
  try{
    const snap=await db.collection('weeks').get(); clearTimeout(timer);
    const remoteT={}; let changed=false;
    snap.docs.forEach(d=>{ const data=d.data(); const n=d.id.replace(/^w/,''); if(!data||!/^\d+$/.test(n)) return; remoteT[n]=data.t||0;
      const loc=state.weeks[n]; if(!loc||(data.t||0)>(loc.t||0)){ state.weeks[n]=JSON.parse(JSON.stringify(data)); changed=true } });
    for(const n in state.weeks){ if((state.weeks[n].t||0)>(remoteT[n]||0)&&hasData(state.weeks[n])) dirty.add(n) }
    if(changed){ saveLocal(); const a=document.activeElement; if(!a||a.tagName!=='INPUT'){ let ui=null; try{ui=localStorage.getItem(LS+'-ui')}catch(e){} if(!ui) view=latestWeek(); render() } }
    setSync('Saved and synced','ok');
    if(dirty.size) flush();
  }catch(e){ clearTimeout(timer); setSync('Saved on this device') }
}

/* ---------- Make it yours: name, units, days and exercises ---------- */
let ED=null;
const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
function openEditor(first){ ED={first:!!first,name:profile.name,unit:profile.unit,plan:clone(PROGRAM),open:first?-1:PROGRAM.findIndex(d=>d.id===dayId)}; $('#editor').hidden=false; drawEditor(); $('#ed-card').scrollTop=0 }
function closeEditor(){ ED=null; $('#editor').hidden=true }
function exEd(ex,di,xi,n){
  return `<div class="ed-ex">
    <input type="text" data-edf="ex.name" data-d="${di}" data-x="${xi}" value="${esc(ex.name)}" placeholder="Exercise name" maxlength="60" aria-label="Exercise name">
    <div class="ed-row">
      <label><span>Sets</span><input type="number" inputmode="numeric" min="1" max="6" data-edf="ex.sets" data-d="${di}" data-x="${xi}" value="${ex.sets}"></label>
      <label><span>Add each time, ${ED.unit}</span><input type="number" inputmode="decimal" min="0" step="any" data-edf="ex.step" data-d="${di}" data-x="${xi}" value="${ex.step}"></label>
      <label><span>Rest, seconds</span><input type="number" inputmode="numeric" min="0" data-edf="ex.rest" data-d="${di}" data-x="${xi}" value="${ex.rest}"></label>
    </div>
    <label class="ed-check"><input type="checkbox" data-edf="ex.added" data-d="${di}" data-x="${xi}"${ex.unit[0]==='+'?' checked':''}>Weight is added to bodyweight (dips, pull-ups)</label>
    <input type="text" data-edf="ex.cue" data-d="${di}" data-x="${xi}" value="${esc(ex.cue||'')}" placeholder="Note to yourself (optional)" maxlength="240" aria-label="Note">
    <div class="ed-mini"><button type="button" data-ed="exup" data-d="${di}" data-x="${xi}"${xi===0?' disabled':''}>Move up</button><button type="button" data-ed="exdown" data-d="${di}" data-x="${xi}"${xi===n-1?' disabled':''}>Move down</button><button type="button" class="del" data-ed="exdel" data-d="${di}" data-x="${xi}">Remove exercise</button></div>
  </div>`;
}
function dayEd(d,di,n){
  const items=d.kind==='gym'?d.ex:d.blocks, open=ED.open===di;
  let h=`<div class="ed-day"><button type="button" class="ed-dayhead" data-ed="toggle" data-d="${di}" aria-expanded="${open}"><span>${esc(d.name||'New day')}</span><small>${items.length} ${d.kind==='gym'?'exercise':'block'}${items.length===1?'':'s'} · ${open?'close':'edit'}</small></button>`;
  if(open){
    h+=`<div class="ed-daybody">
      <label class="ed-f"><span>Day name</span><input type="text" data-edf="day.name" data-d="${di}" value="${esc(d.name)}" placeholder="For example Arms" maxlength="14"></label>
      <label class="ed-f"><span>Where</span><input type="text" data-edf="day.where" data-d="${di}" value="${esc(d.where||'')}" placeholder="Gym, Home, Park" maxlength="10"></label>
      <label class="ed-f"><span>What it trains</span><input type="text" data-edf="day.focus" data-d="${di}" value="${esc(d.focus||'')}" placeholder="For example biceps, triceps, forearms" maxlength="80"></label>`;
    if(d.kind==='gym') h+=d.ex.map((ex,xi)=>exEd(ex,di,xi,d.ex.length)).join('')+`<button type="button" class="ed-add" data-ed="exadd" data-d="${di}">Add an exercise</button>`;
    else h+=`<p class="ed-note">A timed bodyweight day. You can rename or remove its blocks. Days you add yourself are weight-training days.</p>`+d.blocks.map((b,xi)=>`<div class="ed-ex"><input type="text" data-edf="b.name" data-d="${di}" data-x="${xi}" value="${esc(b.name)}" maxlength="60" aria-label="Block name"><div class="ed-mini"><button type="button" class="del" data-ed="bdel" data-d="${di}" data-x="${xi}">Remove block</button></div></div>`).join('');
    h+=`<div class="ed-mini" style="border-top:1px solid var(--line);padding-top:12px"><button type="button" data-ed="dayup" data-d="${di}"${di===0?' disabled':''}>Move day earlier</button><button type="button" data-ed="daydown" data-d="${di}"${di===n-1?' disabled':''}>Move day later</button><button type="button" class="del" data-ed="daydel" data-d="${di}"${n<2?' disabled':''}>Remove day</button></div></div>`;
  }
  return h+'</div>';
}
function drawEditor(){
  const p=ED.plan;
  $('#ed-card').innerHTML=`<div class="sheet-head"><div><span>${ED.first?'Welcome to BarBee':'Settings'}</span><h3 id="ed-title">${ED.first?'Make it yours':'My name and plan'}</h3></div>${ED.first?'':'<button type="button" data-ed="cancel" aria-label="Close without saving">×</button>'}</div>
    ${ED.first?'<p class="ed-note">BarBee tells you what to beat in every session. It starts with an example week: train it as it is, or change any day and exercise below. You can come back to this screen any time by tapping your name.</p>':''}
    <label class="ed-f"><span>Your name</span><input type="text" data-edf="name" value="${esc(ED.name)}" placeholder="Shown at the top of the app" maxlength="40" autocomplete="off"></label>
    <div class="ed-f"><span>Weights in</span><div class="ed-seg">${['kg','lb'].map(u=>`<button type="button" data-ed="unit" data-v="${u}" aria-pressed="${ED.unit===u}">${u}</button>`).join('')}</div></div>
    <h4 class="ed-h">Training days</h4>
    ${p.map((d,di)=>dayEd(d,di,p.length)).join('')}
    ${p.length<7?'<button type="button" class="ed-add" data-ed="addday">Add a training day</button>':''}
    <button type="button" class="ed-link" data-ed="reset">Put the example plan back</button>
    <div class="ed-actions"><button type="button" class="ed-save" data-ed="save">${ED.first?'Start training':'Save'}</button></div>`;
}
function saveEditor(){
  const old={}; PROGRAM.forEach(d=>(d.ex||[]).forEach(x=>{ old[d.id+'.'+x.id]=x.name }));
  const step0=ED.unit==='lb'?5:2.5;
  const plan=ED.plan.map((d,i)=>{ d.name=(d.name||'').trim()||('Day '+(i+1)); d.where=(d.where||'').trim()||(d.kind==='gym'?'Gym':'Cali'); d.focus=(d.focus||'').trim();
    if(d.kind==='gym') d.ex=d.ex.filter(x=>(x.name||'').trim()).map(x=>{ x.name=x.name.trim();
      x.sets=Math.min(6,Math.max(1,Math.round(+x.sets)||2)); x.step=+x.step>0?+x.step:step0; x.rest=+x.rest>=0&&x.rest!==''?Math.round(+x.rest):120;
      x.unit=(x.unit[0]==='+'?'+':'')+ED.unit; if(x.vars&&old[d.id+'.'+x.id]!==x.name) delete x.vars; return x });
    else d.blocks=d.blocks.filter(b=>(b.name||'').trim()).map(b=>{ b.name=b.name.trim(); return b });
    return d });
  PROGRAM=plan; profile={name:ED.name.trim(),unit:ED.unit,set:true};
  try{ localStorage.setItem(LS+'-plan',JSON.stringify(PROGRAM)); localStorage.setItem(LS+'-profile',JSON.stringify(profile)) }catch(e){}
  if(!PROGRAM.some(d=>d.id===dayId)) dayId=PROGRAM[0].id;
  closeEditor(); saveUi(); render(); window.scrollTo(0,0);
}
$('#ed-card').addEventListener('input',e=>{
  const t=e.target, f=t.dataset.edf; if(!f||!ED) return;
  if(f==='name'){ ED.name=t.value; return }
  const d=ED.plan[+t.dataset.d]; if(!d) return;
  if(f.startsWith('day.')){ d[f.slice(4)]=t.value; if(f==='day.name') t.closest('.ed-day').querySelector('.ed-dayhead span').textContent=t.value||'New day'; return }
  if(f==='b.name'){ d.blocks[+t.dataset.x].name=t.value; return }
  const x=d.ex[+t.dataset.x]; if(!x) return;
  if(f==='ex.added') x.unit=(t.checked?'+':'')+ED.unit; else x[f.slice(3)]=t.value;
});
$('#editor').addEventListener('click',e=>{
  if(!ED) return;
  if(e.target.id==='editor'){ if(!ED.first) closeEditor(); return }
  const b=e.target.closest('[data-ed]'); if(!b) return;
  const a=b.dataset.ed, p=ED.plan, di=+b.dataset.d, xi=+b.dataset.x, d=p[di];
  const swap=(arr,i,j)=>{ const t=arr[i]; arr[i]=arr[j]; arr[j]=t };
  if(a==='cancel'){ closeEditor(); return }
  if(a==='save'){ saveEditor(); return }
  if(a==='toggle') ED.open=ED.open===di?-1:di;
  else if(a==='unit'){ const u=b.dataset.v; if(u!==ED.unit){ const k=u==='lb'?2:0.5; p.forEach(day=>(day.ex||[]).forEach(x=>{ x.step=Math.round((+x.step||0)*k*100)/100; x.unit=(x.unit[0]==='+'?'+':'')+u })); ED.unit=u } }
  else if(a==='addday'){ p.push({id:uid('d'),name:'',where:'Gym',kind:'gym',focus:'',tone:TONES[p.length%4],ex:[{id:uid('e'),name:'',sets:2,step:ED.unit==='lb'?5:2.5,unit:ED.unit,rest:120,cue:''}]}); ED.open=p.length-1 }
  else if(a==='daydel'){ if(p.length<2||!confirm('Remove '+(d.name||'this day')+' from the plan?')) return; p.splice(di,1); ED.open=-1 }
  else if(a==='dayup'){ swap(p,di,di-1); ED.open=di-1 }
  else if(a==='daydown'){ swap(p,di,di+1); ED.open=di+1 }
  else if(a==='exadd') d.ex.push({id:uid('e'),name:'',sets:2,step:ED.unit==='lb'?5:2.5,unit:ED.unit,rest:120,cue:''});
  else if(a==='exdel') d.ex.splice(xi,1);
  else if(a==='exup') swap(d.ex,xi,xi-1);
  else if(a==='exdown') swap(d.ex,xi,xi+1);
  else if(a==='bdel'){ if(d.blocks.length<2){ alert('A day needs at least one block. Remove the day instead.'); return } d.blocks.splice(xi,1) }
  else if(a==='reset'){ if(!confirm('Put the example plan back? Your logged numbers stay.')) return; ED.plan=clone(DEFAULT_PROGRAM); if(ED.unit==='lb') ED.plan.forEach(day=>(day.ex||[]).forEach(x=>{ x.step=x.step*2; x.unit=(x.unit[0]==='+'?'+':'')+'lb' })); ED.open=-1 }
  else return;
  drawEditor();
  if(a==='addday'||a==='exadd'){ const ins=$('#ed-card').querySelectorAll(a==='addday'?'[data-edf="day.name"]':'.ed-day [data-edf="ex.name"]'); const el=a==='addday'?ins[0]:[...ins].filter(i=>+i.dataset.d===di).pop(); if(el){ el.focus(); el.scrollIntoView({block:'center'}) } }
});
render();
initSync();
if(!profile.set) openEditor(true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
