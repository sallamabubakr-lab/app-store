<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Biko's Lab</title>
<meta name="description" content="Home-made apps for family and friends.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biko's Lab">
<meta name="theme-color" content="#EAF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one left-aligned column (max 720px). Header with the store name and two tabs,
   a featured panel tinted with the newest app's own colour, then plain rows, not cards. */
:root {
  --bg: #EAF0EC;
  --surface: #FFFFFF;
  --ink: #12211B;
  --muted: #5B6B63;
  --line: #D3DDD6;
  --accent: #2447F0;
  --on-accent: #FFFFFF;
  --update: #F2B01E;
  --on-update: #2A1E00;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1714;
    --surface: #18231E;
    --ink: #EAF2ED;
    --muted: #93A39B;
    --line: #26342D;
    --accent: #8FA2FF;
    --on-accent: #0B1233;
    --update: #F2B01E;
    --on-update: #2A1E00;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 28px) max(20px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 48px) max(20px, env(safe-area-inset-left));
}

/* Header */
.masthead h1 {
  font: 800 clamp(44px, 13vw, 76px)/0.92 var(--display);
  font-stretch: 78%; letter-spacing: -0.02em; margin: 0;
}
.masthead p { margin: 10px 0 0; color: var(--muted); max-width: 34ch; }
.tabs { display: flex; gap: 26px; margin: 26px 0 0; border-bottom: 1px solid var(--line); }
.tabs a {
  position: relative; padding: 10px 0 12px; text-decoration: none;
  font-weight: 600; color: var(--muted);
}
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--ink);
}
.count {
  display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 7px;
  border-radius: 11px; background: var(--update); color: var(--on-update);
  font-size: 13px; line-height: 22px; text-align: center; font-weight: 600;
}

/* App icon */
.icon {
  flex: none; display: block; border-radius: 23%; background: var(--line);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
  object-fit: cover;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 84px; min-height: 38px; padding: 0 20px; border: 0; border-radius: 19px;
  font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap;
  background: var(--accent); color: var(--on-accent);
}
.btn.open { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.update { background: var(--update); color: var(--on-update); }
.btn.big { min-height: 48px; padding: 0 30px; border-radius: 24px; font-size: 17px; }
.btn[aria-disabled="true"] { background: var(--line); color: var(--muted); cursor: default; box-shadow: none; }
.textlink { color: var(--accent); font-weight: 600; text-decoration: none; }
.textlink:hover { text-decoration: underline; }

/* Featured panel: takes the newest app's own colour */
.featured {
  display: block; margin: 26px 0 8px; padding: 22px; border-radius: 26px;
  background: var(--tint, var(--surface)); color: var(--tint-ink, var(--ink));
  text-decoration: none;
}
.featured .kicker { font-weight: 600; font-size: 14px; opacity: 0.8; }
.featured .top { display: flex; gap: 18px; align-items: center; margin-top: 14px; }
.featured h2 { font: 700 clamp(30px, 8vw, 42px)/1 var(--display); font-stretch: 84%; margin: 0; }
.featured p { margin: 6px 0 0; opacity: 0.85; }
.featured .note { margin-top: 16px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); font-size: 15px; }
.featured .btn { background: var(--tint-ink); color: var(--tint); margin-top: 16px; box-shadow: none; }

h2.section { font: 700 22px/1.2 var(--display); font-stretch: 88%; margin: 34px 0 4px; }

/* Rows */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-decoration: none; }
.row .text { min-width: 0; }
.row .name { font-weight: 600; font-size: 17px; line-height: 1.25; }
.row .tag { color: var(--muted); font-size: 14.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .new { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 18px; font-weight: 600; vertical-align: 2px; }
.row .notes { color: var(--muted); font-size: 14.5px; margin-top: 2px; }

/* App page */
.back { display: inline-block; margin-bottom: 22px; font-weight: 600; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--ink); }
.app-head { display: flex; gap: 20px; align-items: flex-start; }
.app-head h1 { font: 800 clamp(32px, 9vw, 48px)/1 var(--display); font-stretch: 82%; letter-spacing: -0.01em; margin: 2px 0 0; }
.app-head .tag { color: var(--muted); margin: 8px 0 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 22px; }
.facts { display: flex; flex-wrap: wrap; margin: 26px 0 0; padding: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div { flex: 1 1 33%; min-width: 120px; padding: 12px 12px 12px 0; }
.facts dt { color: var(--muted); font-size: 13.5px; }
.facts dd { margin: 0; font-weight: 600; }
.prose { max-width: 62ch; white-space: pre-line; }
.shots { display: flex; gap: 12px; overflow-x: auto; margin: 10px -20px 0; padding: 4px 20px 12px; scroll-snap-type: x proximity; }
.shots img { flex: none; width: min(56vw, 230px); height: auto; border-radius: 18px; border: 1px solid var(--line); scroll-snap-align: start; background: var(--surface); }
.keep { background: var(--surface); border-radius: 18px; padding: 16px 18px; margin-top: 10px; max-width: 62ch; }
.keep p { margin: 0; }
.keep p + p { margin-top: 8px; color: var(--muted); font-size: 15px; }
.history { list-style: none; margin: 6px 0 0; padding: 0; }
.history li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.history .v { font-weight: 600; }
.history .d { color: var(--muted); font-size: 14.5px; margin-left: 8px; }
.history p { margin: 2px 0 0; max-width: 62ch; white-space: pre-line; }

.empty { padding: 34px 0; color: var(--muted); max-width: 44ch; }
.empty strong { display: block; color: var(--ink); font: 700 22px/1.2 var(--display); font-stretch: 88%; margin-bottom: 6px; }

footer { margin-top: 44px; color: var(--muted); font-size: 14.5px; max-width: 52ch; }
footer button.textlink { background: none; border: 0; padding: 0; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead" id="masthead">
    <h1 id="storeName">Biko's Lab</h1>
    <p id="storeTagline">Home-made apps for family and friends.</p>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" id="tabApps">Apps</a>
      <a href="#/updates" id="tabUpdates">Updates<span class="count" id="updCount" hidden></span></a>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";

  var view = document.getElementById("view");
  var catalog = null;

  /* ---------- small helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function load(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  var GOT = "sallam-store.got";     // { appId: version the visitor last got }
  var SEEN = "sallam-store.seen";   // app ids the visitor has already been shown
  var got = load(GOT, {});
  var seenBefore = load(SEEN, null); // null on a first visit: nothing is marked "New" then

  var ua = navigator.userAgent;
  var platform = /Android/.test(ua) ? "android"
    : (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) ? "ios"
    : "computer";

  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso || "";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  function fmtSize(bytes) {
    if (!bytes) return "";
    return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + " KB" : (bytes / 1048576).toFixed(1) + " MB";
  }
  function inkFor(hex) {              // dark or light text, whichever reads better on the app's colour
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return null;
    var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#12211B" : "#FFFFFF";
  }
  function byNewest(a, b) { return (b.updated || "").localeCompare(a.updated || ""); }
  function latestNotes(app) { return app.history && app.history[0] ? app.history[0].notes : ""; }

  /* ---------- what the main button does for this visitor ---------- */
  function state(app) {
    if (!(app.id in got)) return "get";
    return got[app.id] === app.version ? "open" : "update";
  }
  function action(app) {
    if (platform === "android" && app.android) return { kind: "apk", href: app.android.file };
    if (app.web) return { kind: "web", href: app.web };
    if (app.android && platform === "computer") return { kind: "apk", href: app.android.file };
    return { kind: "none" };
  }
  function button(app, big) {
    var a = action(app), s = state(app);
    var cls = "btn" + (big ? " big" : "") + (s === "open" ? " open" : s === "update" ? " update" : "");
    if (a.kind === "none") return '<span class="' + cls + '" aria-disabled="true">Android only</span>';
    var label = s === "update" ? "Update" : s === "open" ? (a.kind === "apk" ? "Download again" : "Open") : (a.kind === "apk" && platform === "computer" ? "Download" : "Get");
    var extra = a.kind === "apk" ? " download" : ' target="_blank" rel="noopener"';
    return '<a class="' + cls + '" href="' + esc(a.href) + '"' + extra + ' data-get="' + esc(app.id) + '" aria-label="' + esc(label + " " + app.name) + '">' + label + "</a>";
  }

  /* ---------- views ---------- */
  function row(app, withNotes) {
    var isNew = seenBefore && seenBefore.indexOf(app.id) === -1;
    return '<li class="row">' +
      '<a class="main" href="#/app/' + esc(app.id) + '">' +
        '<img class="icon" src="' + esc(app.icon) + '" alt="" width="60" height="60">' +
        '<span class="text"><span class="name">' + esc(app.name) + (isNew ? '<span class="new">New</span>' : "") + "</span>" +
        '<span class="tag">' + esc(app.tagline) + "</span>" +
        (withNotes ? '<span class="notes">Version ' + esc(app.version) + ", " + esc(fmtDate(app.updated)) + "</span>" : "") +
        "</span></a>" + button(app) + "</li>";
  }

  function home() {
    var apps = catalog.apps.slice().sort(byNewest);
    if (!apps.length) {
      view.innerHTML = '<div class="empty"><strong>No apps yet</strong>The first app will show up here as soon as it is published.</div>';
      return;
    }
    var f = apps[0], ink = inkFor(f.color);
    var style = ink ? ' style="--tint:' + esc(f.color) + ";--tint-ink:" + ink + '"' : "";
    var isFirst = !f.history || f.history.length < 2;
    var html = '<a class="featured" href="#/app/' + esc(f.id) + '"' + style + ">" +
      '<div class="kicker">' + (isFirst ? "Newest app" : "Just updated") + "</div>" +
      '<div class="top"><img class="icon" src="' + esc(f.icon) + '" alt="" width="88" height="88">' +
      "<div><h2>" + esc(f.name) + "</h2><p>" + esc(f.tagline) + "</p></div></div>" +
      (latestNotes(f) && !isFirst ? '<div class="note">' + esc(latestNotes(f)) + "</div>" : "") +
      '<span class="btn">See the app</span></a>';
    html += '<h2 class="section">All apps</h2><ul class="rows">' + apps.map(function (a) { return row(a); }).join("") + "</ul>";
    view.innerHTML = html;
  }

  function updates() {
    var apps = catalog.apps.slice().sort(byNewest);
    var due = apps.filter(function (a) { return state(a) === "update"; });
    var html = "";
    if (due.length) {
      html += '<h2 class="section">Ready to update</h2><ul class="rows">' + due.map(function (a) {
        return '<li class="row"><a class="main" href="#/app/' + esc(a.id) + '">' +
          '<img class="icon" src="' + esc(a.icon) + '" alt="" width="60" height="60">' +
          '<span class="text"><span class="name">' + esc(a.name) + "</span>" +
          '<span class="tag">' + esc(latestNotes(a) || "Version " + a.version) + "</span>" +
          '<span class="notes">Version ' + esc(a.version) + ", you have " + esc(got[a.id]) + "</span></span></a>" + button(a) + "</li>";
      }).join("") + "</ul>";
    } else {
      html += '<div class="empty"><strong>Everything is up to date</strong>When an app you have gets a new version, it appears here.</div>';
    }
    var rest = apps.filter(function (a) { return due.indexOf(a) === -1; });
    if (rest.length) {
      html += '<h2 class="section">Latest versions</h2><ul class="rows">' + rest.map(function (a) { return row(a, true); }).join("") + "</ul>";
    }
    view.innerHTML = html;
  }

  function keepText(app, a) {
    if (a.kind === "apk" && platform === "android") {
      return "<p>Tap the button, then open the downloaded file to install it.</p>" +
        "<p>The first time, your phone asks you to allow installs from your browser. Updates install over the old version and keep your data.</p>";
    }
    if (a.kind === "apk") return "<p>This downloads the Android app file. Send it to an Android phone and open it there to install.</p>";
    if (a.kind === "none") return "<p>This app is made for Android phones. Open this store on an Android phone to get it.</p>";
    if (platform === "ios") return "<p>To keep it on your iPhone: open it, tap the Share button, then Add to Home Screen.</p><p>New versions arrive by themselves the next time you open it.</p>";
    if (platform === "android") return "<p>To keep it on your phone: open it, tap the browser menu, then Add to Home screen.</p><p>New versions arrive by themselves the next time you open it.</p>";
    return "<p>It opens in your browser. On a phone you can add it to the home screen like any other app.</p><p>New versions arrive by themselves the next time you open it.</p>";
  }

  function appPage(id) {
    var app = catalog.apps.filter(function (a) { return a.id === id; })[0];
    if (!app) {
      view.innerHTML = '<a class="back" href="#/">Back to all apps</a><div class="empty"><strong>That app is not in the store</strong>It may have been removed. The list of all apps shows what is available now.</div>';
      return;
    }
    var a = action(app);
    var works = [app.web ? "iPhone, Android, computer" : "", !app.web && app.android ? "Android" : ""].filter(Boolean).join("");
    var html = '<a class="back" href="#/">Back to all apps</a>' +
      '<div class="app-head"><img class="icon" src="' + esc(app.icon) + '" alt="" width="104" height="104">' +
      "<div><h1>" + esc(app.name) + '</h1><p class="tag">' + esc(app.tagline) + "</p></div></div>" +
      '<div class="actions">' + button(app, true);
    if (a.kind === "apk" && app.web) html += '<a class="textlink" href="' + esc(app.web) + '" target="_blank" rel="noopener" data-get="' + esc(app.id) + '">Open in the browser instead</a>';
    if (a.kind === "web" && app.android) html += '<a class="textlink" href="' + esc(app.android.file) + '" download>Android app file' + (app.android.size ? " (" + fmtSize(app.android.size) + ")" : "") + "</a>";
    html += "</div>";
    html += '<dl class="facts"><div><dt>Version</dt><dd>' + esc(app.version) + "</dd></div>" +
      "<div><dt>Updated</dt><dd>" + esc(fmtDate(app.updated)) + "</dd></div>" +
      "<div><dt>Works on</dt><dd>" + esc(works) + "</dd></div></dl>";
    if (app.history && app.history.length > 1 && latestNotes(app)) {
      html += '<h2 class="section">New in this version</h2><p class="prose">' + esc(latestNotes(app)) + "</p>";
    }
    if (app.screenshots && app.screenshots.length) {
      html += '<div class="shots">' + app.screenshots.map(function (s) {
        return '<img src="' + esc(s) + '" alt="' + esc(app.name) + ' screen" loading="lazy">';
      }).join("") + "</div>";
    }
    if (app.description) html += '<h2 class="section">About</h2><p class="prose">' + esc(app.description) + "</p>";
    html += '<h2 class="section">Getting it</h2><div class="keep">' + keepText(app, a) + "</div>";
    if (app.history && app.history.length) {
      html += '<h2 class="section">Version history</h2><ul class="history">' + app.history.map(function (h) {
        return '<li><span class="v">' + esc(h.version) + '</span><span class="d">' + esc(fmtDate(h.date)) + "</span>" +
          (h.notes ? "<p>" + esc(h.notes) + "</p>" : "") + "</li>";
      }).join("") + "</ul>";
    }
    view.innerHTML = html;
  }

  /* ---------- routing ---------- */
  function render() {
    if (!catalog) return;
    var h = location.hash.replace(/^#\/?/, "");
    var onApp = h.indexOf("app/") === 0;
    document.getElementById("masthead").hidden = onApp;
    document.getElementById("tabApps").toggleAttribute("aria-current", !onApp && h !== "updates");
    document.getElementById("tabUpdates").toggleAttribute("aria-current", h === "updates");
    ["tabApps", "tabUpdates"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el.hasAttribute("aria-current")) el.setAttribute("aria-current", "page");
    });
    var n = catalog.apps.filter(function (a) { return state(a) === "update"; }).length;
    var badge = document.getElementById("updCount");
    badge.hidden = !n; badge.textContent = n;
    if ("setAppBadge" in navigator) { try { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) {} }
    if (onApp) appPage(decodeURIComponent(h.slice(4)));
    else if (h === "updates") updates();
    else home();
    document.title = catalog.store.name;
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  // Getting, opening or updating an app records the version this visitor now has.
  document.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-get]");
    if (!el) return;
    var id = el.getAttribute("data-get");
    var app = catalog.apps.filter(function (a) { return a.id === id; })[0];
    if (!app) return;
    got[id] = app.version; save(GOT, got);
    setTimeout(render, 400);   // after the link has opened
  });

  /* ---------- footer: put the store itself on the home screen ---------- */
  var installEvent = null;
  function footer() {
    var foot = document.getElementById("foot");
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (standalone) { foot.innerHTML = ""; return; }
    if (installEvent) {
      foot.innerHTML = 'Keep this store on your phone. <button class="textlink" id="installBtn">Add it to the home screen</button>';
      document.getElementById("installBtn").onclick = function () { installEvent.prompt(); installEvent = null; footer(); };
    } else if (platform === "ios") {
      foot.textContent = "Keep this store on your iPhone: tap the Share button, then Add to Home Screen.";
    } else if (platform === "android") {
      foot.textContent = "Keep this store on your phone: tap the browser menu, then Add to Home screen.";
    } else {
      foot.textContent = "Open this page on your phone to keep the store on your home screen.";
    }
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvent = e; footer(); });

  /* ---------- load the catalogue (always fresh, so new versions show at once) ---------- */
  function fetchCatalog() {
    return fetch("apps.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (data) {
      var first = !catalog;
      catalog = data;
      document.getElementById("storeName").textContent = data.store.name;
      document.getElementById("storeTagline").textContent = data.store.tagline;
      render();
      if (first) { footer(); save(SEEN, data.apps.map(function (a) { return a.id; })); }
    });
  }
  fetchCatalog().catch(function () {
    view.innerHTML = '<div class="empty"><strong>The app list did not load</strong>Check your internet connection, then open the store again.</div>';
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && catalog) fetchCatalog().catch(function () {});
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
